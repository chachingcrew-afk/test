name: Price Scraper (simple)

# Separate from "Track prices": lives in simple-scraper/, saves to the
# Supabase table product_prices. CSV backup is uploaded as a run artifact.
on:
  schedule:
    - cron: "7 6 * * *"   # UTC, 07:07 Dutch time in winter
  workflow_dispatch:

concurrency:
  group: simple-scraper
  cancel-in-progress: false

defaults:
  run:
    working-directory: simple-scraper

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: simple-scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python scraper.py

      - name: Upload CSV backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prices-${{ github.run_id }}
          path: simple-scraper/data/prices.csv
          retention-days: 30
          if-no-files-found: ignore
