# ------------------------------------------------------------------
# Global settings
# ------------------------------------------------------------------
settings:
  runs_per_day: 1          # 1, 2 or 3 (the workflow has 3 slots, see .github/workflows/track-prices.yml)
  proxy_mode: auto         # auto = direct first, proxy only if blocked | always | never
  render_fallback: true    # use a headless browser if nothing else finds the price
  default_currency: EUR    # used when the site does not say it
  delay_seconds: [2, 5]    # random pause between products
  timeout_seconds: 30

# ------------------------------------------------------------------
# Products
#
# Required:  id (stable, never change it: the history is keyed on it), url
# Optional:  name, enabled (true/false), currency,
#            selector     CSS selector for the price, if the automatic methods fail
#            platform     shopify | woocommerce | squarespace (skips detection)
#            proxy_mode   overrides the global setting for this product
#            render       false = never open a browser for this product
#            runs_per_day overrides the global setting for this product
# ------------------------------------------------------------------
products:
  # ---- demo products, replace them with your own ----
  - id: demo-allbirds-tree-runner
    enabled: false
    name: Allbirds Men's Tree Runner (Shopify)
    url: https://www.allbirds.com/products/mens-tree-runners
    currency: USD

  - id: demo-coolblue-airfryer
    enabled: false
    name: Philips Airfryer XXL NA342/00 (Coolblue)
    url: https://www.coolblue.nl/en/product/954609/philips-airfryer-xxl-3000-series-na342-00.html

  - id: demo-woolworths-coffee
    enabled: false
    name: WCafe Italian Blend 1kg (Woolworths ZA)
    url: https://www.woolworths.co.za/prod/Food/Promotions/MyDifference-Favourites/WCafe-Italian-Blend-Coffee-Beans-1-kg/_/A-6009189862465

  # ---- examples of the optional fields ----
  - id: example-with-selector
    name: Example with a custom selector
    url: https://example.com/some/product/page
    selector: ".product-price .current"
    currency: EUR
    runs_per_day: 3
    enabled: false
